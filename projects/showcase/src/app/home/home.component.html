<div class="container mx-auto px-4 mt-4">
  <div class="flex flex-wrap -mx-4 justify-center">
    <div class="w-full px-4 lg:w-10/12">
      <div class="bg-white rounded-lg border border-gray-200 shadow-sm">
        <div class="bg-white rounded-lg border border-gray-200 shadow-sm-body">
          <div class="flex flex-wrap -mx-4">
            <div class="w-full md:w-5/12 px-4">
              <div class="mb-4 mb-4">
                <label for="toastTitle">
                  <strong>Title</strong>
                </label>
                <input
                  [(ngModel)]="title"
                  type="text"
                  class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  name="toastTitle"
                  id="toastTitle"
                  placeholder="Toast title"
                />
              </div>
              <div class="mb-4 mb-4">
                <label for="toastMessage">
                  <strong>Message</strong>
                </label>
                <textarea
                  [(ngModel)]="message"
                  rows="3"
                  class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  name="toastMessage"
                  id="toastMessage"
                  placeholder="Toast message"
                ></textarea>
              </div>

              <div class="mb-4 mb-4">
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.enableHtml"
                    id="enableHtml"
                  />
                  <label class="flex items-center mb-2-label" for="enableHtml"> Enable HTML (message) </label>
                </div>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.tapToDismiss"
                    id="tapToDismiss"
                  />
                  <label class="flex items-center mb-2-label" for="tapToDismiss"> Tap to dismiss </label>
                </div>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.closeButton"
                    id="closeButton"
                  />
                  <label class="flex items-center mb-2-label" for="closeButton"> Close button </label>
                </div>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.preventDuplicates"
                    id="preventDuplicates"
                  />
                  <label class="flex items-center mb-2-label" for="preventDuplicates">
                    Prevent duplicates
                  </label>
                </div>
                <div class="flex items-center mb-2 ml-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.countDuplicates"
                    id="countDuplicates"
                    [disabled]="!options.preventDuplicates"
                  />
                  <label class="flex items-center mb-2-label" for="countDuplicates"> Count duplicates </label>
                </div>
                <div class="flex items-center mb-2 ml-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.resetTimeoutOnDuplicate"
                    id="resetTimeoutOnDuplicate"
                    [disabled]="!options.preventDuplicates"
                  />
                  <label class="flex items-center mb-2-label" for="resetTimeoutOnDuplicate">
                    Reset timeout on duplicate
                  </label>
                </div>
                <div class="flex items-center mb-2 ml-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.includeTitleDuplicates"
                    id="includeTitleDuplicate"
                    [disabled]="!options.preventDuplicates"
                  />
                  <label class="flex items-center mb-2-label" for="includeTitleDuplicate">
                    Include title in duplicate checks
                  </label>
                </div>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.newestOnTop"
                    id="newestOnTop"
                  />
                  <label class="flex items-center mb-2-label" for="newestOnTop"> New toasts on top </label>
                </div>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="checkbox"
                    [(ngModel)]="options.progressBar"
                    id="progressBar"
                  />
                  <label class="flex items-center mb-2-label" for="progressBar"> Progress bar </label>
                </div>
              </div>
              <fieldset class="mb-4 mb-4">
                <label>
                  <strong>Progress Bar Animation</strong>
                </label>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="radio"
                    name="progressAnimationRadio"
                    [(ngModel)]="options.progressAnimation"
                    value="decreasing"
                    [disabled]="!options.progressBar"
                    id="progressBarDecreasing"
                  />
                  <label class="flex items-center mb-2-label" for="progressBarDecreasing">Decreasing</label>
                </div>
                <div class="flex items-center mb-2">
                  <input
                    class="flex items-center mb-2-input"
                    type="radio"
                    name="progressAnimationRadio"
                    [(ngModel)]="options.progressAnimation"
                    value="increasing"
                    [disabled]="!options.progressBar"
                    id="progressBarIncreasing"
                  />
                  <label class="flex items-center mb-2-label" for="progressBarIncreasing"> Increasing </label>
                </div>
              </fieldset>
            </div>
            <div class="w-full md:w-4/12 px-4 mb-2">
              <div class="mb-4 mb-4">
                <label for="toastTimeout">
                  <strong>Timeout</strong>
                </label>
                <input
                  type="text"
                  [(ngModel)]="options.timeOut"
                  (ngModelChange)="fixNumber('timeOut')"
                  [disabled]="
                    options.disableTimeOut === true || options.disableTimeOut === 'timeOut'
                  "
                  class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  id="toastTimeout"
                  aria-describedby="toastTimeoutHelp"
                />
                <small id="toastTimeoutHelp" class="mt-1 text-sm text-gray-500">0 never expires</small>
              </div>
              <div class="mb-4 mb-4">
                <label for="toastExtendedTimeout">
                  <strong>Extended Timeout</strong>
                </label>
                <input
                  type="text"
                  [(ngModel)]="options.extendedTimeOut"
                  (ngModelChange)="fixNumber('extendedTimeOut')"
                  [disabled]="
                    options.disableTimeOut === true || options.disableTimeOut === 'extendedTimeOut'
                  "
                  class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  id="toastExtendedTimeout"
                />
                <small id="toastExtendedTimeoutHelp" class="mt-1 text-sm text-gray-500"
                  >0 never expires</small
                >

                <fieldset class="mb-4 mb-4">
                  <label>
                    <strong>Disable Timeouts</strong>
                  </label>
                  <div class="flex items-center mb-2">
                    <input
                      type="radio"
                      class="flex items-center mb-2-input"
                      [(ngModel)]="options.disableTimeOut"
                      [value]="true"
                      id="disableTimeOut1"
                    />
                    <label for="disableTimeOut" class="flex items-center mb-2-label">
                      <code>disableTimeOut = true</code>
                    </label>
                  </div>
                  <div class="flex items-center mb-2">
                    <input
                      type="radio"
                      class="flex items-center mb-2-input"
                      [(ngModel)]="options.disableTimeOut"
                      [value]="false"
                      id="disableTimeOut2"
                    />
                    <label for="disableTimeOut2" class="flex items-center mb-2-label">
                      <code>disableTimeOut = false</code>
                    </label>
                  </div>
                  <div class="flex items-center mb-2">
                    <input
                      type="radio"
                      class="flex items-center mb-2-input"
                      [(ngModel)]="options.disableTimeOut"
                      value="timeOut"
                      id="disableTimeOut3"
                    />
                    <label for="disableTimeOut3" class="flex items-center mb-2-label">
                      <code>timeOut</code> only
                    </label>
                  </div>
                  <div class="flex items-center mb-2">
                    <input
                      type="radio"
                      class="flex items-center mb-2-input"
                      [(ngModel)]="options.disableTimeOut"
                      value="extendedTimeOut"
                      id="disableTimeOut4"
                    />
                    <label for="disableTimeOut4" class="flex items-center mb-2-label">
                      <code>extendedTimeOut</code> only
                    </label>
                  </div>
                </fieldset>
              </div>
              <div class="mb-4 mb-4">
                <label for="maxNumberToasts">
                  <strong>Maximum Toasts</strong>
                </label>
                <input
                  [(ngModel)]="toastr.toastrConfig.maxOpened"
                  (ngModelChange)="fixNumber('maxOpened')"
                  type="text"
                  class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  id="maxNumberToasts"
                  aria-describedby="maxNumberToastsHelp"
                />
                <small id="maxNumberToastsHelp" class="mt-1 text-sm text-gray-500">0 is no limit</small>
                <div class="flex items-center mb-2">
                  <input
                    type="checkbox"
                    class="flex items-center mb-2-input"
                    [(ngModel)]="toastr.toastrConfig.autoDismiss"
                    id="autoDismiss"
                  />
                  <label for="autoDismiss" class="flex items-center mb-2-label" for="autoDismiss"
                    >Auto dismiss on max</label
                  >
                </div>
              </div>
              <div class="mb-4 mb-4">
                <label for="toastExtendedTimeout">
                  <strong>Ease Time</strong>
                </label>
                <input
                  type="text"
                  [(ngModel)]="toastr.toastrConfig.easeTime"
                  (ngModelChange)="fixNumber('easeTime')"
                  class="block w-full px-3 py-2 bg-white border border-gray-300 rounded-md text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  id="toastExtendedTimeout"
                />
              </div>
            </div>
            <div class="w-full md:w-3/12 px-4">
              <div class="flex flex-wrap -mx-4">
                <div class="w-1/2 px-4 col-md-12">
                  <fieldset class="mb-4 mb-4">
                    <label>
                      <strong>Toast Type</strong>
                    </label>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="typeRadios"
                        [(ngModel)]="type"
                        value="success"
                        id="typesuccess"
                      />
                      <label class="flex items-center mb-2-label" for="typesuccess"> Success </label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="typeRadios"
                        [(ngModel)]="type"
                        value="info"
                        id="typeinfo"
                      />
                      <label class="flex items-center mb-2-label" for="typeinfo"> Info </label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="typeRadios"
                        [(ngModel)]="type"
                        value="warning"
                        id="typewarning"
                      />
                      <label class="flex items-center mb-2-label" for="typewarning"> Warning </label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="typeRadios"
                        [(ngModel)]="type"
                        value="error"
                        id="typeerror"
                      />
                      <label class="flex items-center mb-2-label" for="typeerror"> Error </label>
                    </div>
                  </fieldset>
                </div>
                <div class="w-1/2 px-4 col-md-12">
                  <fieldset class="mb-4 mb-4">
                    <label>
                      <strong>Toast Position</strong>
                    </label>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-top-right"
                        id="toast-top-right"
                      />
                      <label for="toast-top-right" class="flex items-center mb-2-label">Top Right</label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-bottom-right"
                        id="toast-bottom-right"
                      />
                      <label for="toast-bottom-right" class="flex items-center mb-2-label">Bottom Right</label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-bottom-left"
                        id="toast-bottom-left"
                      />
                      <label for="toast-bottom-left" class="flex items-center mb-2-label">Bottom Left</label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-top-left"
                        id="toast-top-left"
                      />
                      <label for="toast-top-left" class="flex items-center mb-2-label">Top Left</label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-top-full-width"
                        id="top-full-width"
                      />
                      <label for="top-full-width" class="flex items-center mb-2-label">Top Full Width</label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-bottom-full-width"
                        id="bottom-full-width"
                      />
                      <label for="bottom-full-width" class="flex items-center mb-2-label"
                        >Bottom Full Width</label
                      >
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-top-center"
                        id="toast-top-center"
                      />
                      <label for="toast-top-center" class="flex items-center mb-2-label">Top Center</label>
                    </div>
                    <div class="flex items-center mb-2">
                      <input
                        class="flex items-center mb-2-input"
                        type="radio"
                        name="positionRadio"
                        [(ngModel)]="options.positionClass"
                        value="toast-bottom-center"
                        id="toast-bottom-center"
                      />
                      <label for="toast-bottom-center" class="flex items-center mb-2-label"
                        >Bottom Center</label
                      >
                    </div>
                  </fieldset>

                </div>
              </div>
            </div>

          </div>
          <hr />
          <div class="flex flex-wrap -mx-4 mb-4">
            <div class="w-full px-4 text-center">
              <p class="mb-1">
                <small>Toast Controls:</small>
              </p>
              <div class="flex justify-center">
                <button
                  (click)="toastManager.openToastAnimation(options, type, { message, title })"
                  type="button"
                  class="inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-primary inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-block mx-1"
                >
                  Open Toast
                </button>

                <button
                  (click)="toastManager.clearLastToast()"
                  type="button"
                  class="inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-outline-primary inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-block mx-1"
                >
                  Clear Last Toast
                </button>

                <button
                  (click)="toastManager.clearToasts()"
                  type="button"
                  class="inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-outline-primary inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-block mx-1"
                >
                  Clear All Toasts
                </button>
              </div>
            </div>
          </div>
            <div class="flex flex-wrap -mx-4 mb-2">
              <div class="w-full px-4 text-center">
                <p class="mb-1">
                  <small>Example Custom Toasts:</small>
                </p>
                <button
                  (click)="toastManager.openToastNoAnimation(options, type, { message, title })"
                  type="button"
                  class="inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-sm inline-flex justify-center rounded-md border border-transparent px-4 py-2 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2-light mx-1"
                >
                  No Animations
                </button>
              </div>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>
