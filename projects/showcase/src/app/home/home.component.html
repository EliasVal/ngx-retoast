<main class="container mx-auto px-4 py-10 max-w-7xl">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    <div class="lg:col-span-7 xl:col-span-8 flex flex-col gap-6">
      <h2 class="text-2xl font-bold tracking-tight">Configuration</h2>

      <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
        <div class="flex flex-col gap-6">
          <div class="card bg-base-200">
            <div class="card-body">
              <h3 class="card-title text-base">Type & Position</h3>
              <app-type-position [(options)]="toastOptions" [(toastType)]="toastType" />
            </div>
          </div>

          <div class="card bg-base-200">
            <div class="card-body">
              <app-progress-bar [(options)]="toastOptions" />
            </div>
          </div>
        </div>

        <div class="card bg-base-200">
          <div class="card-body">
            <h3 class="card-title text-base">Behavior</h3>
            <app-options [(options)]="toastOptions" />
          </div>
        </div>

        <div class="card bg-base-200 xl:col-span-2">
          <div class="card-body">
            <h3 class="card-title text-base">Timeouts & Animations</h3>
            <app-timeouts [(options)]="toastOptions" />
          </div>
        </div>
      </div>
    </div>

    <app-preview-panel [toastOptions]="toastOptions()" [toastType]="toastType()" />
  </div>
</main>
