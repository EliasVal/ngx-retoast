<div class="flex flex-col gap-4">
  <fieldset class="fieldset">
    <legend class="fieldset-legend">Toast Type</legend>
    <select class="select w-full" [formField]="typeForm" id="toastTypeSelect">
      @for (type of types; track type.id) {
        <option [value]="type.value">{{ type.label }}</option>
      }
    </select>
  </fieldset>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Position</legend>
    <select class="select w-full" [formField]="positionForm.positionClass" id="toastPositionSelect">
      @for (pos of positions; track pos.id) {
        <option [value]="pos.value">{{ pos.label }}</option>
      }
    </select>
  </fieldset>
</div>
